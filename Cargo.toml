[workspace]
resolver = "3"
members = [
    "crates/xisf-core",
    "crates/xisf",
    "crates/libxisf",
    "crates/xisftool",
]
# `cargo fuzz` builds this on its own, with nightly and a sanitizer. Keeping it
# out means the stable six-platform CI never has to know it exists.
exclude = ["fuzz"]

[workspace.package]
# Each crate carries its own version and is released on its own cadence.
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/cruzzil/xisf"
authors = ["The xisf-rs Developers"]

[workspace.dependencies]
xisf-core = { path = "crates/xisf-core", version = "0.5.0" }
xisf = { path = "crates/xisf", version = "0.5.0" }

quick-xml = "0.42"
base64 = "0.23"
flate2 = "1"
lz4_flex = "0.14"
# Zstandard, both directions. Pure Rust rather than the `zstd` crate's C
# bindings: that keeps the whole workspace free of a C toolchain, which matters
# for the six-platform CI and lets Miri run. `simd` is left off for the same
# reason -- it is a decoder feature, and the codebase stays interpretable
# without it.
zrip = { version = "0.8", default-features = false, features = ["std", "frame"] }
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
memmap2 = "0.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Reach for the narrowest crate that has the item: `core` for anything that
# needs no allocator, `alloc` for anything that needs one but not an operating
# system. Nothing here is `no_std` today, and `xisf-core` could plausibly
# become so -- it is parsing and arithmetic over a byte slice, with the file
# and memory-map handling confined to the reader -- so writing `core::` from
# the start keeps that door open instead of leaving a mechanical sweep to do
# later. It also documents which parts genuinely need the platform.
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"

[profile.release]
lto = "thin"
